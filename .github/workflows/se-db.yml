# Bygger den svenska varudatabasen (public/data) från Open Food Facts varje vecka.
# Netlify publicerar automatiskt när jobbet sparar nya data i repot.
name: Svensk varudatabas

on:
  schedule:
    - cron: "17 3 * * 1"   # måndagar 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_db.py
      - .github/workflows/se-db.yml

permissions:
  contents: write

concurrency:
  group: se-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Bygg databasen
        id: build
        continue-on-error: true
        run: python3 tools/build_db.py public/data

      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatera svensk varudatabas"
            git pull --rebase origin main
            git push
          fi

      - name: Markera fel
        if: steps.build.outcome == 'failure'
        run: |
          cat public/data/status.json
          exit 1
